# ⚠️ 堆从 8G 降到 3G（2026-10-25）。
# 原配置 -Xmx8G + MaxMetaspace 4G，Gradle daemon 起不来：
#   os::commit_memory failed; error='页面文件太小，无法完成操作' (DOS error/errno=1455)
# 根因**不是物理内存**（31.5 GB，还空 8 GB），而是 Windows 的**提交内存**被占满：
#   已提交 67.6 GB / 上限 69.0 GB，只剩 1.4 GB
# 当时 HNPCInferServer 一个进程提交了 32 GB（工作集 0，纯占额度）。
# JVM 启动要一次性提交整块堆，1.4 GB 连 -Xms2G 都装不下，所以连编译都没开始就崩。
# 那个进程重启后剩余 48.8 GB，3G 堆跑得动。
# 以后再遇到同样的错：先看「已提交/上限」，别急着骂内存条。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# 少开 worker：每个 worker 也是一个 JVM 分叉，提交空间紧张时必须压下来
org.gradle.workers.max=2
org.gradle.parallel=false
# 不用常驻 daemon：省掉 launcher + daemon 两份 JVM 的提交
org.gradle.daemon=false
# Kotlin 用 in-process 编译：默认会另起一个 Kotlin daemon（再吃 1~2 GB 提交）
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9 自带 Kotlin 支持，开着它避免和 share_plus 等插件里自带的
# kotlin-android 插件冲突（两套 Kotlin 编译器会让 daemon 崩掉）
android.builtInKotlin=true

# ⚠️ 关掉资源名缩短（2026-10-23）。
# 默认开着的时候 res/raw/sound_cheerful.mp3 会被改写成 res/3u.mp3，
# 而提醒铃声是按字符串名取的（android.resource://包名/raw/sound_cheerful），
# 名字一改就查不到资源 —— 代码不报错、APK 里也能看到音频文件，
# 但真机上就是没声音，排查起来极其费劲。
android.enableResourceOptimizations=false

